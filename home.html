<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | SevenChat</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

  <div class="auth-container">

    <h1>SevenChat</h1>

    <h2>Login</h2>

    <input
      type="email"
      placeholder="Email"
      id="email"
      autocomplete="email"
    >

    <input
      type="password"
      placeholder="Password"
      id="password"
      autocomplete="current-password"
    >

    <button
      class="primary"
      id="loginBtn"
      type="button"
    >
      Login
    </button>

    <p class="link">
      Don't have an account?
      <a class="sign" href="signup.html">
        Sign up
      </a>
    </p>

  </div>

  <script type="module" src="auth.js"></script>

</body>

</html>

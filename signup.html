<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account || SevenChat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconect" href="https://font.googleapis.com">
  <link rel="preconect"
  href="https://fonts.gstatic.com"
  crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet">

</head>

<body>
  <div class="glass-container">
    
  <div class="logo">
  </div>
    
    <h1>Create Account</h1>
    <p>Join the SevenChat cummuinty.</p>
  
  <input
  type="text"
  id="name"
  placeholder="Full Name"
  required>

  <input
  type="text"
  id="username"
  placeholder="Username"
  required>
  
  <h3>Choose an Avatar</h3>

<div class="avatar-grid">
  
  <img src="images/avatars/avatar1.png" class="avatar selected" data-avatar="avatar1.png">
  
  <img src="images/avatars/avatar2.png" class="avatar" data-avatar="avatar2.png">
  
  <img src="images/avatars/avatar3.png" class="avatar" data-avatar="avatar3.png">
  
  <img src="images/avatars/avatar4.png" class="avatar" data-avatar="avatar4.png">
  
  <img src="images/avatars/avatar5.png" class="avatar" data-avatar="avatar5.png">
  
  <img src="images/avatars/avatar6.png" class="avatar" data-avatar="avatar6.png">
  
</div>
  
  
  
  
    <input
   type="email"
   id="email"||
   placeholder="Email">
   
   <input
   type="password"
   id="password"
   placeholder="Password">
   
   <input
   type="password"
   id="confirmPassword"
   placeholder="Confirm Password">
   
   <button type="button"
   class="primary"
   id="signupBtn">
     Create Account
   </button>
   
   <p class="link">
     Already have an account?
     <a href="login.html">
       Login
     </a>
   </p>
</div>   
<script type="module" src="auth.js"></script>
</body>

</html>
